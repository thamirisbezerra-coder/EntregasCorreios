<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Logística 2026 - Admin</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        /* Animações Suaves */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        
        /* Scrollbar Moderna */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Utilitários */
        .season-btn { transition: all 0.2s ease; border-left: 3px solid transparent; }
        .season-btn:hover { background-color: rgba(255,255,255,0.05); }
        .season-btn.active { background-color: rgba(255,255,255,0.1); border-left-color: #60a5fa; color: white; font-weight: 600; }

        /* --- ESTILO DE IMPRESSÃO PAISAGEM (A4 DEITADO) - CORRIGIDO V15 --- */
        @media print {
            @page { 
                size: A4 landscape;
                margin: 0mm; /* Controle total da margem via CSS */
            }
            
            /* Reset Global para Impressão */
            html, body {
                width: 100%;
                height: 100%;
                margin: 0 !important;
                padding: 0 !important;
                background: white;
                overflow: visible !important;
            }

            /* Esconde explicitamente tudo que não é o relatório */
            body * { 
                visibility: hidden; 
            }
            
            #root, main, aside, header, .no-print {
                display: none !important; 
            }
            
            /* Traz o relatório para frente e o posiciona no topo */
            #print-section, #print-section * { 
                visibility: visible; 
            }
            
            #print-section { 
                display: block !important; 
                position: absolute; /* Essencial para sobrepor o layout */
                left: 0; 
                top: 0; 
                width: 100%; 
                margin: 0; 
                padding: 0;
                background: white;
                z-index: 9999; /* Garante que fique por cima de tudo */
            }
            
            /* Container da Página A4 Paisagem */
            .print-page {
                width: 297mm; /* Largura A4 Paisagem */
                height: 209mm; /* Altura A4 Paisagem */
                page-break-after: always;
                break-after: page;
                position: relative;
                display: flex;
                flex-direction: column;
                padding: 10mm; /* Margem interna */
                box-sizing: border-box;
                background: white;
            }
            
            .print-page:last-child {
                page-break-after: auto;
                break-after: auto;
            }

            /* Tabela Fixa */
            table { 
                width: 100% !important; 
                border-collapse: collapse !important; 
                border: 2px solid #000;
                table-layout: fixed; 
            }
            
            th, td { 
                border: 1px solid #000 !important; 
                padding: 2px 8px !important; 
                font-size: 11px !important; 
                text-align: left; 
                vertical-align: middle; 
                word-wrap: break-word; 
            }
            
            th { 
                background-color: #eee !important; 
                font-weight: 800; 
                text-transform: uppercase; 
                border-bottom: 2px solid #000 !important;
                height: 30px;
                color: black !important;
                -webkit-print-color-adjust: exact;
            }
            
            /* Altura fixa para linhas */
            tr.data-row { height: 13.5mm; } 
            tr.data-row td { height: 13.5mm; } 
            
            .assinatura-col { 
                vertical-align: bottom !important; 
                padding-bottom: 2px !important; 
            } 
            
            /* Rodapé fixo */
            .page-footer {
                margin-top: auto; 
                padding-top: 5px;
                border-top: 2px solid #000;
                font-size: 10px;
                font-weight: bold;
                display: flex;
                justify-content: space-between;
                width: 100%;
            }
        }
    </style>

    <!-- Import Map -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "recharts": "https://esm.sh/recharts?deps=react@18.2.0,react-dom@18.2.0",
        "lucide-react": "https://esm.sh/lucide-react?deps=react@18.2.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
      }
    }
    </script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone@7.23.8/babel.min.js"></script>
</head>
<body class="h-screen overflow-hidden text-slate-800 selection:bg-blue-100 selection:text-blue-900">
    <div id="root" class="h-full"></div>

    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState, useMemo, useEffect } from 'react';
        import ReactDOM from 'react-dom/client';
        import { initializeApp } from "firebase/app";
        import { getFirestore, collection, addDoc, query, orderBy, updateDoc, doc, onSnapshot, deleteDoc } from "firebase/firestore";
        import { 
          BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip as RechartsTooltip, Legend, ResponsiveContainer, 
          PieChart, Pie, Cell 
        } from 'recharts';
        import { 
          Package, Truck, Users, FileText, LayoutDashboard, X, CheckCircle2,
          Calendar as CalendarIcon, UserCheck, Search as SearchIcon, AlertTriangle,
          Menu, Plus, Save, Edit3, Clock, CalendarDays, ChevronDown, History, ClipboardList, FileSpreadsheet,
          Printer, HelpCircle, ArrowRight, Box, Barcode, MapPin, Building2, User, ChevronRight, Filter, TrendingUp, Trash2, CheckSquare, ListChecks
        } from 'lucide-react';

        // --- Configuração Firebase ---
        const firebaseConfig = {
          apiKey: "AIzaSyASMPEJRmb6gIGKZZ80vMcUwPBW-T-HSyc",
          authDomain: "entregascorreios-4696c.firebaseapp.com",
          projectId: "entregascorreios-4696c",
          storageBucket: "entregascorreios-4696c.firebasestorage.app",
          messagingSenderId: "57805415230",
          appId: "1:57805415230:web:4fa0934a922466d922026f",
          measurementId: "G-J2V5Z36B1Z"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Cores mais sofisticadas para gráficos
        const COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#6366f1'];

        const MONTHS_CONFIG = [
            { id: '01', name: 'Janeiro' }, { id: '02', name: 'Fevereiro' }, { id: '03', name: 'Março' },
            { id: '04', name: 'Abril' }, { id: '05', name: 'Maio' }, { id: '06', name: 'Junho' },
            { id: '07', name: 'Julho' }, { id: '08', name: 'Agosto' }, { id: '09', name: 'Setembro' },
            { id: '10', name: 'Outubro' }, { id: '11', name: 'Novembro' }, { id: '12', name: 'Dezembro' },
        ];

        // --- Helpers ---
        const parseDateYear = (dateStr) => {
             if (!dateStr) return 0;
             if (dateStr.includes('/')) return parseInt(dateStr.split('/')[2]);
             if (dateStr.includes('-')) return parseInt(dateStr.split('-')[0]);
             return 0;
        };

        const compareDates = (a, b) => {
            const parse = (str) => {
                if (!str) return new Date(0);
                const parts = str.split('/');
                if (parts.length === 3) return new Date(parts[2], parts[1] - 1, parts[0]);
                return new Date(0);
            };
            return parse(b) - parse(a);
        };

        const Badge = ({ children, color = 'slate', icon: Icon, filled = false }) => (
            <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wide border transition-all
                ${filled 
                    ? `bg-${color}-500 text-white border-${color}-600 shadow-sm` 
                    : `bg-${color}-50 text-${color}-700 border-${color}-200`
                }`}>
                {Icon && <Icon size={12} strokeWidth={2.5} />}
                {children}
            </span>
        );

        function App() {
          const [deliveries, setDeliveries] = useState([]); 
          const [searchTerm, setSearchTerm] = useState('');
          const [activeTab, setActiveTab] = useState('list'); 
          
          const currentMonthIndex = new Date().getMonth(); 
          const currentMonthId = String(currentMonthIndex + 1).padStart(2, '0');
          const [selectedMonth, setSelectedMonth] = useState(currentMonthId); 

          const [currentYear, setCurrentYear] = useState(2026);
          const [viewYear, setViewYear] = useState(2026);
          
          const [isSidebarOpen, setIsSidebarOpen] = useState(false);
          const [isModalOpen, setIsModalOpen] = useState(false); 
          const [isImportModalOpen, setIsImportModalOpen] = useState(false); 
          const [editingId, setEditingId] = useState(null);
          
          const todayISO = new Date().toISOString().split('T')[0]; 
          const [printDate, setPrintDate] = useState(todayISO);
          const [onlyPendingPrint, setOnlyPendingPrint] = useState(true);

          // Estado para seleção manual de impressão
          const [isSelectionMode, setIsSelectionMode] = useState(false);
          const [selectedIds, setSelectedIds] = useState(new Set());

          const [newDeliveryForm, setNewDeliveryForm] = useState({
            data: '', remetente: '', transportadora: '', doc: '', entreguePara: '', quemEntregou: '', setor: '', obs: ''
          });

          const [importForm, setImportForm] = useState({ month: currentMonthId, textData: '' });

          useEffect(() => {
            const q = query(collection(db, "entregas"), orderBy("createdAt", "desc"));
            const unsubscribe = onSnapshot(q, (querySnapshot) => {
              const loadedData = [];
              querySnapshot.forEach((doc) => loadedData.push({ id: doc.id, ...doc.data() }));
              setDeliveries(loadedData);
            });
            return () => unsubscribe();
          }, []);

          const availableYears = useMemo(() => {
              const years = new Set([currentYear]);
              deliveries.forEach(d => {
                  const y = parseDateYear(d.data);
                  if (y > 2020) years.add(y);
              });
              return Array.from(years).sort((a,b) => b - a);
          }, [deliveries, currentYear]);

          const handleSaveDelivery = async (e) => {
            e.preventDefault();
            
            // Pergunta de segurança se estiver marcando como entregue
            if (newDeliveryForm.entreguePara && newDeliveryForm.entreguePara.length > 2) {
                const confirmDelivery = window.confirm(`Atenção:\n\nVocê preencheu que este item foi recebido por: ${newDeliveryForm.entreguePara}.\n\nConfirma que este item já foi entregue?`);
                if (!confirmDelivery) return;
            }

            const newEntry = {
              ...newDeliveryForm,
              remetente: newDeliveryForm.remetente.toUpperCase(),
              transportadora: newDeliveryForm.transportadora.toUpperCase() || 'NÃO INF.',
              setor: newDeliveryForm.setor.toUpperCase() || 'GERAL',
              doc: newDeliveryForm.doc || '-',
              entreguePara: newDeliveryForm.entreguePara || '-',
              quemEntregou: newDeliveryForm.quemEntregou || '',
            };

            try {
                if (editingId) {
                    await updateDoc(doc(db, "entregas", editingId), newEntry);
                } else {
                    await addDoc(collection(db, "entregas"), { ...newEntry, createdAt: new Date().toISOString() });
                }
                setIsModalOpen(false);
            } catch (error) {
                alert("Erro ao salvar: " + error.message);
            }
          };

          const handleDelete = async (id) => {
             const password = window.prompt("DIGITE A SENHA DE ADMINISTRADOR PARA EXCLUIR:");
             if (password === 'admin123') {
                 try {
                     await deleteDoc(doc(db, "entregas", id));
                     const newSet = new Set(selectedIds);
                     if (newSet.has(id)) {
                         newSet.delete(id);
                         setSelectedIds(newSet);
                     }
                 } catch (error) {
                     alert("Erro ao excluir: " + error.message);
                 }
             } else if (password !== null) {
                 alert("Senha incorreta!");
             }
          };

          const handleOpenNew = () => {
            setEditingId(null);
            setNewDeliveryForm({
              data: new Date().toLocaleDateString('pt-BR'),
              remetente: '', transportadora: '', doc: '', entreguePara: '', quemEntregou: '', setor: '', obs: ''
            });
            setIsModalOpen(true);
          };

          const handleOpenEdit = (item) => {
            setEditingId(item.id);
            setNewDeliveryForm({ ...item });
            setIsModalOpen(true);
          };

          const handleProcessImport = async () => {
              const lines = importForm.textData.split('\n');
              lines.forEach(async line => {
                  const cols = line.split('\t');
                  if(cols.length > 3) {
                      await addDoc(collection(db, "entregas"), {
                          data: cols[0], remetente: cols[1], transportadora: cols[2], doc: cols[3],
                          entreguePara: cols[4] || '-', setor: cols[5] || 'GERAL', createdAt: new Date().toISOString()
                      });
                  }
              });
              setIsImportModalOpen(false);
              setImportForm({...importForm, textData: ''});
          };

          // Lógica de Seleção
          const toggleSelection = (id) => {
              const newSet = new Set(selectedIds);
              if (newSet.has(id)) {
                  newSet.delete(id);
              } else {
                  newSet.add(id);
              }
              setSelectedIds(newSet);
          };

          const toggleSelectAll = (items) => {
              if (selectedIds.size > 0) {
                  setSelectedIds(new Set()); // Desmarcar tudo
              } else {
                  const newSet = new Set();
                  items.forEach(item => newSet.add(item.id));
                  setSelectedIds(newSet);
              }
          };

          const toggleSelectionMode = () => {
              if (isSelectionMode) {
                  // Cancelar
                  setIsSelectionMode(false);
                  setSelectedIds(new Set());
              } else {
                  // Ativar
                  setIsSelectionMode(true);
              }
          };

          const filteredDeliveries = useMemo(() => {
            let data = deliveries.filter(d => parseDateYear(d.data) === viewYear);
            if (activeTab === 'list') {
                data = data.filter(d => d.data && d.data.split('/')[1] === selectedMonth);
            }
            if (searchTerm) {
              const lower = searchTerm.toLowerCase();
              data = data.filter(d => Object.values(d).some(val => String(val).toLowerCase().includes(lower)));
            }
            return data.sort((a, b) => compareDates(a.data, b.data)); 
          }, [deliveries, searchTerm, selectedMonth, viewYear, activeTab]);

          const printData = useMemo(() => {
              // MODO 1: Seleção Manual
              if (isSelectionMode && selectedIds.size > 0) {
                  return deliveries.filter(d => selectedIds.has(d.id));
              }

              // MODO 2: Filtros Padrão
              if (!printDate) return [];
              const [y, m, d] = printDate.split('-');
              const targetBR = `${d}/${m}/${y}`; 
              
              const dayItems = deliveries.filter(item => item.data.trim() === targetBR);
              
              if (onlyPendingPrint) {
                  return dayItems.filter(item => !item.obs || item.obs.trim() === '');
              }
              
              return dayItems;
          }, [deliveries, printDate, onlyPendingPrint, selectedIds, isSelectionMode]);

          // Lógica de Paginação com preenchimento ROBUSTO (Garante 10 linhas sempre)
          const printPages = useMemo(() => {
              const ITEMS_PER_PAGE = 10;
              const pages = [];
              const items = [...printData];
              
              // Se não tiver itens, gera 1 página com 10 "items vazios"
              if (items.length === 0) {
                  pages.push(new Array(ITEMS_PER_PAGE).fill({ isEmpty: true }));
                  return pages;
              }

              for (let i = 0; i < items.length; i += ITEMS_PER_PAGE) {
                  const chunk = items.slice(i, i + ITEMS_PER_PAGE);
                  // Preenche com objetos "vazios" para manter a altura da página estável
                  while (chunk.length < ITEMS_PER_PAGE) {
                      chunk.push({ isEmpty: true });
                  }
                  pages.push(chunk);
              }
              return pages;
          }, [printData]);

          const stats = useMemo(() => {
            const dataYear = deliveries.filter(d => parseDateYear(d.data) === viewYear);
            const total = dataYear.length;
            const sectorCount = {};
            const monthCount = {};
            const carrierCount = {};
            dataYear.forEach(d => {
              sectorCount[d.setor] = (sectorCount[d.setor] || 0) + 1;
              carrierCount[d.transportadora] = (carrierCount[d.transportadora] || 0) + 1;
              const m = d.data.split('/')[1];
              const name = MONTHS_CONFIG.find(mc => mc.id === m)?.name.substring(0,3) || m;
              monthCount[name] = (monthCount[name] || 0) + 1;
            });
            const topSectors = Object.entries(sectorCount).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([name, value]) => ({ name, value }));
            const topCarriers = Object.entries(carrierCount).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([name, value]) => ({ name, value }));
            const chartData = MONTHS_CONFIG.map(m => ({ name: m.name.substring(0,3), value: monthCount[m.name.substring(0,3)] || 0 }));
            return { total, topSectors, topCarriers, chartData };
          }, [deliveries, viewYear]);

          const getStatusColor = (entregue) => (entregue && entregue !== '-' && entregue.length > 2) ? 'emerald' : 'amber';
          const getStatusText = (entregue) => (entregue && entregue !== '-' && entregue.length > 2) ? 'Entregue' : 'Pendente';

          return (
            <div className="flex h-screen bg-slate-100 overflow-hidden relative font-sans text-slate-800">
              
              {/* Sidebar Moderna (Drawer) */}
              <aside className={`fixed inset-y-0 left-0 z-50 w-64 bg-[#0f172a] text-slate-400 transition-transform duration-300 transform ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'} flex flex-col shadow-2xl no-print border-r border-slate-800`}>
                <div className="h-20 flex items-center justify-between px-6 border-b border-slate-800/50 bg-[#0f172a]">
                    <div className="flex items-center gap-2">
                        <img src="https://i.postimg.cc/MZyMHZbD/as-02-(1).png" alt="Logo" className="h-6 w-auto object-contain" />
                        <span className="font-bold text-white tracking-wide text-sm">Menu</span>
                    </div>
                    <button onClick={() => setIsSidebarOpen(false)} className="text-slate-500 hover:text-white transition-colors">
                        <X size={20} />
                    </button>
                </div>

                <div className="flex-1 overflow-y-auto py-6 px-4 space-y-6">
                    <div>
                        <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 px-2">Navegação</p>
                        <nav className="space-y-1">
                            <button onClick={() => {setActiveTab('list'); setIsSidebarOpen(false)}} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all duration-200 ${activeTab === 'list' ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/30' : 'hover:bg-slate-800 hover:text-white'}`}>
                                <FileText size={18} /> <span className="font-medium text-sm">Diário</span>
                            </button>
                            <button onClick={() => {setActiveTab('dashboard'); setIsSidebarOpen(false)}} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all duration-200 ${activeTab === 'dashboard' ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/30' : 'hover:bg-slate-800 hover:text-white'}`}>
                                <LayoutDashboard size={18} /> <span className="font-medium text-sm">Dashboard</span>
                            </button>
                        </nav>
                    </div>
                    
                    <div>
                        <div className="flex items-center justify-between px-2 mb-3">
                             <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Mês de Referência</p>
                             <div className="bg-slate-800 text-slate-300 text-[10px] font-bold px-1.5 py-0.5 rounded border border-slate-700">{viewYear}</div>
                        </div>
                        <div className="space-y-0.5">
                            {MONTHS_CONFIG.map(m => (
                                <button key={m.id} onClick={() => {setSelectedMonth(m.id); setActiveTab('list');}} 
                                    className={`season-btn w-full flex items-center justify-between text-left px-3 py-2 text-xs rounded-md ${selectedMonth === m.id ? 'active' : 'text-slate-400'}`}>
                                    <span>{m.name}</span>
                                    {selectedMonth === m.id && <ChevronRight size={12} className="text-blue-400"/>}
                                </button>
                            ))}
                        </div>
                    </div>

                    {availableYears.length > 1 && (
                        <div>
                             <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 px-2">Anos Anteriores</p>
                             <div className="flex flex-wrap gap-2">
                                 {availableYears.map(year => (
                                     <button key={year} onClick={() => setViewYear(year)} 
                                        className={`text-xs px-3 py-1 rounded border transition-colors ${viewYear === year ? 'bg-amber-500/10 text-amber-500 border-amber-500/50' : 'border-slate-700 text-slate-500 hover:border-slate-500'}`}>
                                         {year}
                                     </button>
                                 ))}
                             </div>
                        </div>
                    )}
                </div>

                <div className="p-4 border-t border-slate-800 bg-[#0f172a]">
                    <button onClick={() => setIsImportModalOpen(true)} className="flex items-center justify-center gap-2 w-full bg-slate-800 hover:bg-slate-700 text-white text-xs py-3 rounded-xl border border-slate-700 transition-all shadow-sm">
                        <FileSpreadsheet size={16} className="text-emerald-500" /> Importar
                    </button>
                </div>
              </aside>

              {/* Backdrop */}
              {isSidebarOpen && (
                  <div className="fixed inset-0 z-40 bg-black/50 backdrop-blur-sm transition-opacity" onClick={() => setIsSidebarOpen(false)}></div>
              )}

              {/* Conteúdo Principal */}
              <main className="flex-1 flex flex-col min-w-0 bg-slate-50 relative h-full overflow-hidden">
                
                {/* Header Glassmorphism Com Logo */}
                <header className="h-20 bg-white/90 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-6 shadow-sm z-20 no-print sticky top-0 transition-all">
                    <div className="flex items-center gap-5">
                        <button onClick={() => setIsSidebarOpen(true)} className="p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl transition-colors shadow-sm border border-slate-200"><Menu size={20} /></button>
                        
                        <div className="flex items-center gap-3 pr-4 border-r border-slate-200">
                             <img src="https://i.postimg.cc/MZyMHZbD/as-02-(1).png" alt="Logo Principal" className="h-8 w-auto object-contain" />
                        </div>

                        <div className="hidden sm:block">
                            <h1 className="text-lg font-bold text-slate-800 tracking-tight flex items-center gap-2 leading-none">
                                {activeTab === 'list' ? <span>Entregas <span className="text-slate-300 font-normal mx-1">/</span> {MONTHS_CONFIG.find(m => m.id === selectedMonth)?.name}</span> : 'Visão Geral'}
                            </h1>
                            <p className="text-[11px] text-slate-400 font-medium mt-1 uppercase tracking-wide">Controle Logístico • {viewYear}</p>
                        </div>
                    </div>
                    
                    <div className="flex items-center gap-3">
                         {viewYear !== currentYear && (
                            <div className="hidden lg:flex items-center gap-2 px-3 py-1.5 bg-amber-50 border border-amber-100 rounded-lg text-amber-700 text-xs font-bold animate-pulse">
                                <History size={14} /> Histórico {viewYear}
                            </div>
                        )}
                        
                        <div className="relative group hidden md:block">
                            <SearchIcon className="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400 group-focus-within:text-blue-500 transition-colors" />
                            <input type="text" placeholder="Buscar..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} 
                                className="pl-10 pr-4 py-2 w-48 text-sm bg-slate-50 border border-slate-200 rounded-full focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all" 
                            />
                        </div>

                        <button onClick={handleOpenNew} disabled={viewYear !== currentYear} 
                            className={`flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-bold shadow-lg shadow-blue-500/20 transition-all hover:-translate-y-0.5 active:translate-y-0 ${viewYear !== currentYear ? 'bg-slate-200 text-slate-400 cursor-not-allowed shadow-none' : 'bg-blue-600 hover:bg-blue-700 text-white'}`}>
                            <Plus size={18} /> <span className="hidden sm:inline">Nova Entrega</span>
                        </button>
                    </div>
                </header>

                <div className="flex-1 overflow-auto p-4 sm:p-6 lg:p-8 relative scrollbar-hide">
                   
                   {/* Layout de Impressão - PROTOCOLO COM GRADE FIXA E ROBUSTA */}
                   <div id="print-section" className="hidden">
                       {printPages.map((pageItems, pageIndex) => (
                           <div key={pageIndex} className="print-page">
                               {/* Cabeçalho da Página */}
                               <div className="flex flex-col gap-2 mb-4">
                                   <div className="flex justify-between items-center border-b pb-2 border-black">
                                       <img src="https://i.postimg.cc/MZyMHZbD/as-02-(1).png" alt="Logo" className="h-14 w-auto grayscale" />
                                       <div className="text-right">
                                           <h1 className="text-xl font-bold uppercase tracking-tight">Protocolo de Entrega</h1>
                                           <p className="text-[10px] mt-1 text-gray-600">
                                               {isSelectionMode && selectedIds.size > 0 
                                                   ? <span>Itens Selecionados: <strong>{selectedIds.size} volumes</strong></span> 
                                                   : <span>Data Ref: <strong>{printDate.split('-').reverse().join('/')}</strong></span>
                                               }
                                           </p>
                                       </div>
                                   </div>
                               </div>
                               
                               {/* Corpo da Tabela */}
                               <div className="flex-1">
                                   <table className="w-full">
                                       <thead>
                                           <tr>
                                               <th style={{width: '10%'}}>Data/Origem</th>
                                               <th style={{width: '30%'}}>Remetente</th>
                                               <th style={{width: '15%'}}>Doc/NF</th>
                                               <th style={{width: '10%'}}>Setor</th>
                                               <th style={{width: '35%'}}>Assinatura / Recebido Por</th>
                                           </tr>
                                       </thead>
                                       <tbody>
                                           {pageItems.map((d, i) => (
                                               <tr key={i} className="data-row">
                                                   {!d.isEmpty ? (
                                                       <>
                                                           <td>
                                                               <strong>{d.data}</strong><br/>
                                                               {d.transportadora}
                                                           </td>
                                                           <td>
                                                               <strong>{d.remetente}</strong>
                                                               {d.obs && <div className="italic text-[9px] mt-1">Obs: {d.obs}</div>}
                                                           </td>
                                                           <td>{d.doc !== '-' ? d.doc : ''}</td>
                                                           <td className="font-bold">{d.setor}</td>
                                                           <td className="assinatura-col relative">
                                                                {d.entreguePara && d.entreguePara !== '-' && d.entreguePara.length > 1 ? (
                                                                    <div className="text-xs">
                                                                        Entregue para: <strong>{d.entreguePara}</strong>
                                                                    </div>
                                                                ) : (
                                                                    <div className="w-full h-full flex flex-col justify-end pb-1">
                                                                        <div className="border-b border-black w-full mb-2"></div>
                                                                        <div className="flex justify-between items-end w-full px-1">
                                                                            <span className="text-[9px]">Setor: ________________</span>
                                                                            <span className="text-[8px] italic">Data: ___/___</span>
                                                                        </div>
                                                                    </div>
                                                                )}
                                                           </td>
                                                       </>
                                                   ) : (
                                                       // Linha Vazia (Padding) - Agora com células explícitas
                                                       <>
                                                           <td>&nbsp;</td>
                                                           <td></td>
                                                           <td></td>
                                                           <td></td>
                                                           <td className="assinatura-col">
                                                               <div className="border-b border-black w-full h-8 mt-2 opacity-10"></div>
                                                           </td>
                                                       </>
                                                   )}
                                               </tr>
                                           ))}
                                       </tbody>
                                   </table>
                               </div>

                               {/* Rodapé da Página */}
                               <div className="page-footer">
                                   <span>Controle Logístico Interno</span>
                                   <span>Página {pageIndex + 1} de {printPages.length}</span>
                                   <span>Impresso em: {new Date().toLocaleString('pt-BR')}</span>
                               </div>
                           </div>
                       ))}
                   </div>

                   {/* Dashboard Tab */}
                   {activeTab === 'dashboard' && (
                       <div className="space-y-6 animate-in max-w-7xl mx-auto no-print">
                           <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                               <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-shadow">
                                   <div className="flex items-center gap-3 mb-2">
                                       <div className="p-2 bg-blue-50 text-blue-600 rounded-lg"><Package size={20}/></div>
                                       <span className="text-sm font-bold text-slate-500 uppercase tracking-wide">Total {viewYear}</span>
                                   </div>
                                   <h3 className="text-4xl font-bold text-slate-800">{stats.total}</h3>
                                   <p className="text-xs text-slate-400 mt-2 font-medium">encomendas processadas</p>
                               </div>
                               <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-shadow">
                                   <div className="flex items-center gap-3 mb-2">
                                       <div className="p-2 bg-emerald-50 text-emerald-600 rounded-lg"><Building2 size={20}/></div>
                                       <span className="text-sm font-bold text-slate-500 uppercase tracking-wide">Top Setor</span>
                                   </div>
                                   <h3 className="text-2xl font-bold text-slate-800 truncate">{stats.topSectors[0]?.name || '-'}</h3>
                                   <p className="text-xs text-emerald-600 mt-2 font-bold bg-emerald-50 inline-block px-2 py-0.5 rounded-full">{stats.topSectors[0]?.value || 0} recebimentos</p>
                               </div>
                               <div className="bg-gradient-to-br from-indigo-600 to-violet-700 p-6 rounded-2xl shadow-lg shadow-indigo-200 text-white relative overflow-hidden">
                                   <div className="absolute top-0 right-0 p-4 opacity-10 transform translate-x-4 -translate-y-4"><Package size={100} /></div>
                                   <div className="relative z-10">
                                       <p className="text-indigo-100 text-xs font-bold uppercase mb-1">Acesso Rápido</p>
                                       <h3 className="text-xl font-bold mb-4 leading-tight">Registrar nova encomenda?</h3>
                                       <button onClick={handleOpenNew} disabled={viewYear !== currentYear} className="w-full bg-white/20 hover:bg-white/30 backdrop-blur-sm border border-white/20 text-white py-2.5 rounded-xl text-sm font-bold transition-all">
                                           Abrir Formulário
                                       </button>
                                   </div>
                               </div>
                           </div>
                           
                           <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 min-h-[400px]">
                               <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex flex-col">
                                   <h4 className="font-bold text-slate-700 mb-6 flex items-center gap-2"><BarChart size={18} className="text-blue-500"/> Volume Mensal</h4>
                                   <div className="flex-1 w-full h-72">
                                       <ResponsiveContainer>
                                           <BarChart data={stats.chartData}>
                                               <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                               <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{fontSize: 12, fill: '#94a3b8'}} dy={10} />
                                               <YAxis axisLine={false} tickLine={false} tick={{fontSize: 12, fill: '#94a3b8'}} />
                                               <RechartsTooltip cursor={{fill: '#f8fafc'}} contentStyle={{borderRadius: '12px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)'}} />
                                               <Bar dataKey="value" fill="#3b82f6" radius={[6, 6, 0, 0]} barSize={40} />
                                           </BarChart>
                                       </ResponsiveContainer>
                                   </div>
                               </div>
                               <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex flex-col">
                                   <h4 className="font-bold text-slate-700 mb-6 flex items-center gap-2"><PieChart size={18} className="text-emerald-500"/> Distribuição por Setor</h4>
                                   <div className="flex-1 w-full h-72">
                                       <ResponsiveContainer>
                                           <PieChart>
                                               <Pie data={stats.topSectors} innerRadius={80} outerRadius={110} paddingAngle={4} dataKey="value" cornerRadius={6}>
                                                   {stats.topSectors.map((entry, index) => (<Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} stroke="none" />))}
                                               </Pie>
                                               <RechartsTooltip contentStyle={{borderRadius: '12px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)'}} />
                                               <Legend verticalAlign="bottom" height={36} iconType="circle" iconSize={8} wrapperStyle={{fontSize: '12px', color: '#64748b'}} />
                                           </PieChart>
                                       </ResponsiveContainer>
                                   </div>
                               </div>
                           </div>
                       </div>
                   )}

                   {/* List Tab */}
                   {activeTab === 'list' && (
                       <div className="space-y-4 animate-in max-w-7xl mx-auto no-print">
                           
                           {/* Filter Bar Moderna */}
                           <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-wrap gap-4 items-center justify-between sticky top-0 z-10">
                               <div className="flex items-center gap-4">
                                   
                                   {/* Botão de Controle Principal */}
                                   {isSelectionMode ? (
                                       <div className="flex items-center gap-2 animate-in">
                                           <button onClick={() => window.print()} className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-xs font-bold transition-all shadow-md shadow-blue-500/30">
                                               <Printer size={16} /> <span>Imprimir ({selectedIds.size}) Selecionados</span>
                                           </button>
                                           <button onClick={toggleSelectionMode} className="text-xs font-bold text-red-500 hover:bg-red-50 px-3 py-2 rounded-lg transition-colors border border-transparent hover:border-red-100">
                                               Cancelar Seleção
                                           </button>
                                       </div>
                                   ) : (
                                       <button onClick={toggleSelectionMode} className="flex items-center gap-2 bg-slate-800 hover:bg-slate-900 text-white px-5 py-2.5 rounded-xl text-xs font-bold transition-all shadow-md">
                                           <ListChecks size={16} /> <span>Selecionar para Impressão</span>
                                       </button>
                                   )}

                                   {/* Filtros Padrão (só aparecem se NÃO estiver selecionando, para não confundir) */}
                                   {!isSelectionMode && (
                                       <>
                                           <div className="h-6 w-px bg-slate-200 hidden sm:block"></div>
                                           <div className="flex items-center gap-2 bg-slate-50 border border-slate-200 px-3 py-2 rounded-xl">
                                               <CalendarDays size={16} className="text-slate-400"/>
                                               <input type="date" value={printDate} onChange={e => setPrintDate(e.target.value)} className="bg-transparent border-none text-xs font-bold text-slate-700 focus:ring-0 p-0 outline-none cursor-pointer" />
                                           </div>
                                            <label className="flex items-center gap-2 text-xs font-bold text-slate-600 cursor-pointer select-none">
                                                <input type="checkbox" checked={onlyPendingPrint} onChange={e => setOnlyPendingPrint(e.target.checked)} className="rounded text-blue-600 focus:ring-blue-500 border-slate-300 w-3.5 h-3.5" />
                                                <span>Apenas Sem Observação (Pendentes)</span>
                                            </label>
                                            <button onClick={() => window.print()} className="p-2 text-slate-400 hover:text-blue-600 transition-colors" title="Imprimir Rápida (Dia atual)">
                                                <Printer size={18} />
                                            </button>
                                       </>
                                   )}
                               </div>
                               
                               <div className="flex items-center gap-2">
                                   <span className="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded">Total na Tela: {filteredDeliveries.length}</span>
                               </div>
                           </div>

                           {/* Tabela Card Moderno */}
                           <div className="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                               <div className="overflow-x-auto">
                                   <table className="w-full text-left text-sm">
                                       <thead>
                                           <tr className="bg-slate-50/80 border-b border-slate-100 text-xs uppercase text-slate-400 font-bold tracking-wider">
                                               {isSelectionMode && (
                                                   <th className="px-4 py-4 w-12 text-center animate-in">
                                                       <input type="checkbox" 
                                                           className="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 border-slate-300 cursor-pointer"
                                                           checked={filteredDeliveries.length > 0 && selectedIds.size === filteredDeliveries.length}
                                                           onChange={() => toggleSelectAll(filteredDeliveries)}
                                                       />
                                                   </th>
                                               )}
                                               <th className={`px-6 py-4 ${!isSelectionMode ? 'pl-8' : ''}`}>Info. Entrega</th>
                                               <th className="px-6 py-4">Remetente / Docs</th>
                                               <th className="px-6 py-4">Status Logístico</th>
                                               <th className="px-6 py-4">Setor</th>
                                               <th className="px-6 py-4 w-24 text-right">Ações</th>
                                           </tr>
                                       </thead>
                                       <tbody className="divide-y divide-slate-50">
                                           {filteredDeliveries.length > 0 ? filteredDeliveries.map((item) => {
                                               const statusColor = getStatusColor(item.entreguePara);
                                               const isSelected = selectedIds.has(item.id);
                                               return (
                                               <tr key={item.id} className={`hover:bg-blue-50/30 transition-colors group ${isSelected ? 'bg-blue-50/40' : ''}`}>
                                                   {isSelectionMode && (
                                                       <td className="px-4 py-5 text-center align-top pt-8 animate-in">
                                                           <input type="checkbox" 
                                                               className="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 border-slate-300 cursor-pointer"
                                                               checked={isSelected}
                                                               onChange={() => toggleSelection(item.id)}
                                                           />
                                                       </td>
                                                   )}
                                                   <td className={`px-6 py-5 align-top w-48 ${!isSelectionMode ? 'pl-8' : ''}`}>
                                                       <div className="flex flex-col gap-2">
                                                           <div className="flex items-center gap-2">
                                                               <span className="text-lg font-bold text-slate-700 tracking-tight leading-none">{item.data.split('/')[0]}</span>
                                                               <div className="flex flex-col">
                                                                   <span className="text-[10px] font-bold text-slate-400 uppercase leading-none">{MONTHS_CONFIG.find(m => m.id === item.data.split('/')[1])?.name.substring(0,3)}</span>
                                                                   <span className="text-[10px] text-slate-300 leading-none">{item.data.split('/')[2]}</span>
                                                               </div>
                                                           </div>
                                                           <div className="flex items-center gap-1.5">
                                                               <div className={`p-1 rounded ${item.transportadora === 'SEDEX' ? 'bg-yellow-100 text-yellow-700' : 'bg-slate-100 text-slate-500'}`}>
                                                                    <Truck size={10} strokeWidth={3} />
                                                               </div>
                                                               <span className="text-[10px] font-bold text-slate-500 uppercase">{item.transportadora}</span>
                                                           </div>
                                                       </div>
                                                   </td>
                                                   <td className="px-6 py-5 align-top">
                                                       <div className="font-bold text-slate-800 text-sm mb-1">{item.remetente}</div>
                                                       <div className="flex flex-wrap gap-2 items-center">
                                                           {item.doc && item.doc !== '-' && (
                                                               <div className="flex items-center gap-1.5 text-slate-400 bg-slate-50 px-2 py-0.5 rounded border border-slate-100">
                                                                    <Barcode size={10} />
                                                                    <span className="text-[10px] font-mono">{item.doc}</span>
                                                               </div>
                                                           )}
                                                           {item.obs && (
                                                               <div className="flex items-center gap-1 text-amber-600 bg-amber-50 px-2 py-0.5 rounded border border-amber-100/50">
                                                                   <AlertTriangle size={10} />
                                                                   <span className="text-[10px] font-medium leading-tight max-w-[200px] truncate">{item.obs}</span>
                                                               </div>
                                                           )}
                                                       </div>
                                                   </td>
                                                   <td className="px-6 py-5 align-top">
                                                       <Badge color={statusColor} icon={statusColor === 'emerald' ? CheckCircle2 : Clock} filled={statusColor === 'emerald'}>
                                                           {getStatusText(item.entreguePara)}
                                                       </Badge>
                                                       {statusColor === 'emerald' && (
                                                           <div className="mt-2 flex items-start gap-2">
                                                               <div className="mt-0.5 h-1.5 w-1.5 rounded-full bg-emerald-200"></div>
                                                               <div>
                                                                   <p className="text-[11px] font-bold text-slate-700 leading-none">{item.entreguePara}</p>
                                                                   {item.quemEntregou && <p className="text-[10px] text-slate-400 mt-0.5">Entregue por: {item.quemEntregou}</p>}
                                                               </div>
                                                           </div>
                                                       )}
                                                   </td>
                                                   <td className="px-6 py-5 align-top">
                                                       <Badge color="indigo" icon={Building2}>{item.setor}</Badge>
                                                   </td>
                                                   <td className="px-6 py-5 text-right">
                                                       {viewYear === currentYear && (
                                                           <div className="flex gap-1 justify-end">
                                                               <button onClick={() => handleOpenEdit(item)} title="Editar" className="p-2 text-slate-300 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all transform hover:scale-110">
                                                                   <Edit3 size={16} />
                                                               </button>
                                                               <button onClick={() => handleDelete(item.id)} title="Excluir (Requer Senha)" className="p-2 text-slate-300 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all transform hover:scale-110">
                                                                   <Trash2 size={16} />
                                                               </button>
                                                           </div>
                                                       )}
                                                   </td>
                                               </tr>
                                           )}) : (
                                               <tr>
                                                   <td colSpan={isSelectionMode ? 6 : 5} className="px-6 py-20 text-center">
                                                       <div className="flex flex-col items-center justify-center text-slate-300">
                                                           <div className="bg-slate-50 p-4 rounded-full mb-3">
                                                               <Package size={40} strokeWidth={1.5} className="text-slate-200" />
                                                           </div>
                                                           <p className="text-sm font-bold text-slate-400">Nenhum registro encontrado.</p>
                                                           <p className="text-xs text-slate-300 mt-1">Tente ajustar os filtros ou adicione uma nova entrega.</p>
                                                       </div>
                                                   </td>
                                               </tr>
                                           )}
                                       </tbody>
                                   </table>
                               </div>
                           </div>
                       </div>
                   )}
                </div>
              </main>

              {/* MODAL NOVA ENTREGA */}
              {isModalOpen && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-in no-print">
                  <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh] ring-1 ring-white/10">
                    <div className="px-8 py-5 border-b border-slate-100 flex justify-between items-center bg-white sticky top-0 z-10">
                      <div>
                          <h3 className="text-xl font-bold text-slate-800">{editingId ? 'Editar Registo' : 'Nova Encomenda'}</h3>
                          <p className="text-xs font-medium text-slate-400 mt-0.5">Preencha os detalhes logísticos abaixo.</p>
                      </div>
                      <button onClick={() => setIsModalOpen(false)} className="bg-slate-50 p-2 rounded-full text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors"><X size={20} /></button>
                    </div>
                    
                    <form onSubmit={handleSaveDelivery} className="flex-1 overflow-y-auto p-8 bg-slate-50/50">
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                          
                          {/* Coluna 1 */}
                          <div className="space-y-5">
                              <div className="flex items-center gap-2 text-blue-600 mb-2">
                                  <Box size={16} strokeWidth={2.5}/>
                                  <span className="text-xs font-bold uppercase tracking-wider">Detalhes da Carga</span>
                              </div>
                              
                              <div className="grid grid-cols-2 gap-4">
                                  <div className="space-y-1.5">
                                      <label className="text-[11px] font-bold text-slate-500 uppercase">Data Recebimento</label>
                                      <input required type="text" placeholder="DD/MM/AAAA" className="w-full px-4 py-2.5 text-sm bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all font-medium" value={newDeliveryForm.data} onChange={e => setNewDeliveryForm({...newDeliveryForm, data: e.target.value})} />
                                  </div>
                                  <div className="space-y-1.5">
                                      <label className="text-[11px] font-bold text-slate-500 uppercase">Documento / NF</label>
                                      <input type="text" placeholder="Ex: 55432" className="w-full px-4 py-2.5 text-sm bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all font-medium" value={newDeliveryForm.doc} onChange={e => setNewDeliveryForm({...newDeliveryForm, doc: e.target.value})} />
                                  </div>
                              </div>
                              
                              <div className="space-y-1.5">
                                  <label className="text-[11px] font-bold text-slate-500 uppercase">Remetente</label>
                                  <input required type="text" placeholder="Empresa ou Pessoa" className="w-full px-4 py-2.5 text-sm bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all font-medium" value={newDeliveryForm.remetente} onChange={e => setNewDeliveryForm({...newDeliveryForm, remetente: e.target.value})} />
                              </div>

                              <div className="space-y-1.5">
                                  <label className="text-[11px] font-bold text-slate-500 uppercase">Transportadora</label>
                                  <div className="relative">
                                      <select className="w-full px-4 py-2.5 text-sm bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all font-medium appearance-none" value={newDeliveryForm.transportadora} onChange={e => setNewDeliveryForm({...newDeliveryForm, transportadora: e.target.value})}>
                                          <option value="">Selecione a empresa...</option>
                                          <option value="SEDEX">Correios / Sedex</option>
                                          <option value="PAC">Correios / PAC</option>
                                          <option value="FEDEX">FedEx Express</option>
                                          <option value="DHL">DHL Logistics</option>
                                          <option value="AZUL">Azul Cargo</option>
                                          <option value="MOTOBOY">Motoboy / Entregador</option>
                                          <option value="OUTROS">Outros</option>
                                      </select>
                                      <ChevronDown size={16} className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
                                  </div>
                              </div>
                          </div>

                          {/* Coluna 2 */}
                          <div className="space-y-5">
                              <div className="flex items-center gap-2 text-emerald-600 mb-2">
                                  <MapPin size={16} strokeWidth={2.5}/>
                                  <span className="text-xs font-bold uppercase tracking-wider">Encaminhamento</span>
                              </div>

                              <div className="space-y-1.5">
                                  <label className="text-[11px] font-bold text-slate-500 uppercase">Setor Destino</label>
                                  <input required type="text" placeholder="Ex: RH, TI, Manutenção" className="w-full px-4 py-2.5 text-sm bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none transition-all font-medium" value={newDeliveryForm.setor} onChange={e => setNewDeliveryForm({...newDeliveryForm, setor: e.target.value})} />
                              </div>

                              <div className="p-5 bg-white rounded-xl border border-slate-200 shadow-sm space-y-4">
                                  <div className="flex items-center gap-2 text-slate-400 border-b border-slate-100 pb-2">
                                      <UserCheck size={14} /> <span className="text-[10px] uppercase font-bold tracking-wider">Baixa de Entrega</span>
                                  </div>
                                  <div className="space-y-1.5">
                                      <label className="text-[10px] font-bold text-slate-400">Recebido Por</label>
                                      <input type="text" placeholder="Nome do Funcionário (Confirma a entrega)" className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:border-emerald-500 outline-none transition-all" value={newDeliveryForm.entreguePara} onChange={e => setNewDeliveryForm({...newDeliveryForm, entreguePara: e.target.value})} />
                                  </div>
                                  <div className="space-y-1.5">
                                      <label className="text-[10px] font-bold text-slate-400">Entregue Por (Logística)</label>
                                      <input type="text" placeholder="Seu nome" className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:border-emerald-500 outline-none transition-all" value={newDeliveryForm.quemEntregou} onChange={e => setNewDeliveryForm({...newDeliveryForm, quemEntregou: e.target.value})} />
                                  </div>
                              </div>
                          </div>
                      </div>

                      <div className="mt-8 space-y-1.5">
                          <label className="text-[11px] font-bold text-slate-500 uppercase">Observações Adicionais</label>
                          <textarea rows="2" className="w-full px-4 py-3 text-sm bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none resize-none transition-all" placeholder="Informações sobre avarias, volumes extras ou instruções especiais..." value={newDeliveryForm.obs} onChange={e => setNewDeliveryForm({...newDeliveryForm, obs: e.target.value})}></textarea>
                      </div>
                    </form>

                    <div className="p-5 bg-white border-t border-slate-100 flex justify-end gap-3 sticky bottom-0 z-10">
                        <button type="button" onClick={() => setIsModalOpen(false)} className="px-6 py-2.5 text-sm font-bold text-slate-500 hover:text-slate-700 hover:bg-slate-100 rounded-xl transition-colors">Cancelar</button>
                        <button onClick={handleSaveDelivery} className="px-8 py-2.5 text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-lg shadow-blue-500/30 flex items-center gap-2 transform hover:-translate-y-0.5 transition-all">
                            <Save size={18} /> Confirmar Registo
                        </button>
                    </div>
                  </div>
                </div>
              )}

              {/* MODAL IMPORTAÇÃO SIMPLIFICADO */}
              {isImportModalOpen && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-in no-print">
                  <div className="bg-white rounded-2xl shadow-2xl w-full max-w-3xl h-[70vh] flex flex-col overflow-hidden">
                      <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                          <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2"><FileSpreadsheet className="text-emerald-600"/> Importação em Massa</h3>
                          <button onClick={() => setIsImportModalOpen(false)} className="text-slate-400 hover:text-slate-600"><X size={24}/></button>
                      </div>
                      <div className="flex-1 p-6 flex flex-col gap-4">
                          <div className="bg-blue-50 border border-blue-100 p-4 rounded-xl text-sm text-blue-800 flex gap-3 items-start">
                              <div className="mt-0.5"><HelpCircle size={16}/></div>
                              <div>
                                  <strong>Instruções:</strong> Copie as células do seu Excel e cole abaixo.
                                  <br/>A ordem das colunas deve ser: <code className="bg-white px-1 py-0.5 rounded border border-blue-200 text-xs font-bold">Data</code> <code className="bg-white px-1 py-0.5 rounded border border-blue-200 text-xs font-bold">Remetente</code> <code className="bg-white px-1 py-0.5 rounded border border-blue-200 text-xs font-bold">Transportadora</code> <code className="bg-white px-1 py-0.5 rounded border border-blue-200 text-xs font-bold">Doc</code> <code className="bg-white px-1 py-0.5 rounded border border-blue-200 text-xs font-bold">Recebedor</code>
                              </div>
                          </div>
                          <textarea className="flex-1 w-full border border-slate-300 rounded-xl p-4 font-mono text-xs focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none resize-none leading-relaxed" placeholder="Cole seus dados aqui..." value={importForm.textData} onChange={e => setImportForm({...importForm, textData: e.target.value})}></textarea>
                      </div>
                      <div className="p-6 border-t border-slate-100 flex justify-end gap-3 bg-slate-50">
                          <button onClick={() => setIsImportModalOpen(false)} className="px-6 py-2.5 text-slate-600 font-bold hover:bg-slate-200 rounded-xl text-sm transition-colors">Cancelar</button>
                          <button onClick={handleProcessImport} className="px-8 py-2.5 bg-emerald-600 text-white rounded-xl text-sm font-bold hover:bg-emerald-700 shadow-lg shadow-emerald-500/20 transition-all flex items-center gap-2">
                              <CheckCircle2 size={18}/> Processar Dados
                          </button>
                      </div>
                  </div>
                </div>
              )}

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
